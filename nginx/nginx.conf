# Reverse proxy для программного комплекса Watch.
# HTTP (REST API) + WebSocket (Socket.IO) за одним nginx.
#
# upstream должен указывать на инстансы приложения (uvicorn/gunicorn).
# Пример: несколько инстансов за nginx (горизонтальное масштабирование):
#   upstream watch_backend {
#       server app-1:8000;
#       server app-2:8000;
#   }

upstream watch_backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемых файлов-подтверждений
    client_max_body_size 50m;

    # --- REST API ---
    location / {
        proxy_pass http://watch_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # --- Socket.IO (WebSocket): заголовки Upgrade обязательны ---
    location /socket.io/ {
        proxy_pass http://watch_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}